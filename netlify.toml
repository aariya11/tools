[build]
  publish = "dist"
  command = "npm run build"

# Route rewrites and the real HTTP 404 fallback are generated in dist/_redirects.
# No country-based redirects: every supported route uses the same public URL.

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
